name: Build and verify complete offline Windows GUI
on:
  push:
    branches: [fast-viewshed-gui]
    paths: ['FastViewshed_GUI_Windows/**', '.github/workflows/build-offline-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: offline-windows-release
  cancel-in-progress: false
jobs:
  offline-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: FastViewshed_GUI_Windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: pack-tools
          python-version: '3.12'
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true
      - name: Install build tools and native Windows dependencies
        shell: bash -el {0}
        run: |
          conda install -n pack-tools conda-pack setuptools -y
          conda env create --prefix "$PWD/_build/runtime_build" --file environment-fast.yml -y
      - name: Pack private interpreter, GIS and Qt dependencies
        shell: bash -el {0}
        run: python scripts/build_offline_windows.py --runtime _build/runtime_build --output _build/dist --revision "$GITHUB_SHA"
      - name: Install and test real GUI with outbound network blocked
        run: |
          Start-Transcript -Path _build/dist/OFFLINE_WINDOWS_BUILD_LOG.txt
          try {
            ./scripts/test_offline_windows.ps1 -Archive _build/dist/FastViewshed_Offline_Windows_x64_v3.4.0.zip -Output _build/dist
          } finally {
            Stop-Transcript
          }
      - name: Build Windows installer and graphical launcher
        run: |
          Copy-Item _build/dist/WINDOWS_OFFLINE_VALIDATION.json _build/dist/stage/FastViewshed_Offline_Windows_x64/
          ./scripts/build_windows_installer.ps1 -Stage _build/dist/stage/FastViewshed_Offline_Windows_x64 -Output _build/dist -Version 3.4.0
      - name: Test actual installation, desktop icon, launch and uninstall offline
        run: ./scripts/test_windows_installer.ps1 -Installer _build/dist/FastViewshed_Setup_v3.4.0_Windows_x64.exe -Output _build/dist
      - name: Report installation errors
        if: failure()
        run: |
          if (Test-Path _build/dist/OFFLINE_WINDOWS_BUILD_LOG.txt) {
            $text = Get-Content _build/dist/OFFLINE_WINDOWS_BUILD_LOG.txt -Raw
            $escaped = $text.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Offline Windows installation transcript::$escaped"
          }
      - name: Package the Windows installer as Setup.exe with clear instructions
        run: |
          $installer = '_build/dist/FastViewshed_Setup_v3.4.0_Windows_x64.exe'
          $digest = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          python scripts/package_installer_download.py --installer $installer --version 3.4.0 --expected-sha256 $digest --output _build/dist
      - name: Finalize tested artifact
        shell: bash -el {0}
        run: python scripts/finalize_offline_release.py _build/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-installer-verification
          retention-days: 7
          if-no-files-found: warn
          path: |
            FastViewshed_GUI_Windows/_build/dist/*.json
            FastViewshed_GUI_Windows/_build/dist/*.log
            FastViewshed_GUI_Windows/_build/dist/*.txt
      - name: Publish complete offline package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = 'v3.4.0-installer'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target ((git rev-parse HEAD).Trim()) --title 'Fast Viewshed 3.4.0 - offline Windows installer with custom maps, protected UI and startup logo' --notes-file RELEASE_OFFLINE.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          gh release upload $tag _build/dist/00_FastViewshed_Windows_Setup_v3.4.0.zip _build/dist/FastViewshed_Setup_v3.4.0_Windows_x64.exe _build/dist/WINDOWS_INSTALLER_VALIDATION.json _build/dist/FastViewshed_Offline_Windows_x64_v3.4.0.zip _build/dist/SHA256SUMS.txt _build/dist/WINDOWS_OFFLINE_VALIDATION.json _build/dist/RUNTIME_MANIFEST.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
