name: Build and test complete private logo kit 3.5
on:
  push:
    branches: [fast-viewshed-gui]
    paths: ['private_logo_kit/**', '.github/workflows/private-logo-kit.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: private-logo-kit
  cancel-in-progress: false
jobs:
  private-kit:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the pinned complete native runtime payload
        run: |
          New-Item -ItemType Directory -Path private-kit-output -Force | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/davidkordmir-source/AD/releases/download/v3.4.0-installer/FastViewshed_Offline_Windows_x64_v3.4.0.zip' -OutFile private-kit-output/VerifiedOffline.zip
          $hash = (Get-FileHash private-kit-output/VerifiedOffline.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '07640d806a43a961b7134a661854cbba85317896ff4b3a707ab1b3242e25a404') { throw 'Offline payload SHA256 mismatch.' }
      - name: Package complete local build tools without a private logo
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6'
          python private_logo_kit/package_private_kit.py --offline-archive private-kit-output/VerifiedOffline.zip --compiler $compiler --output private-kit-output
          if ($LASTEXITCODE -ne 0) { throw 'Complete kit packaging failed.' }
      - name: Test full output, transferred portable runtime and actual installation
        run: |
          Start-Transcript -Path private-kit-output/PRIVATE_LOGO_COMPLETE_LOG_v3.5.0.txt
          try {
            ./private_logo_kit/test_private_kit.ps1 -Archive private-kit-output/FastViewshed_Complete_Private_Kit_v3.5.0.zip -Output ((Resolve-Path private-kit-output).Path)
          } finally { Stop-Transcript }
      - name: Publish the verified complete toolkit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v3.5.0-private-kit *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v3.5.0-private-kit --target $env:GITHUB_SHA --title 'Fast Viewshed 3.5 - complete offline output with embedded private logo' --notes-file private_logo_kit/RELEASE_FA.md
            if ($LASTEXITCODE -ne 0) { throw 'Creating the verified release failed.' }
          }
          gh release upload v3.5.0-private-kit private-kit-output/FastViewshed_Complete_Private_Kit_v3.5.0.zip private-kit-output/FastViewshed_Complete_Private_Kit_v3.5.0.zip.sha256 private-kit-output/PRIVATE_LOGO_COMPLETE_VALIDATION_v3.5.0.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Verified complete kit publication failed.' }
      - name: Publish build status and diagnostic logs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_KIT_JOB_STATUS: ${{ job.status }}
        run: |
          New-Item -ItemType Directory -Path private-kit-output -Force | Out-Null
          @{status=$env:PRIVATE_KIT_JOB_STATUS;version='3.5.0';revision=$env:GITHUB_SHA;run_id=$env:GITHUB_RUN_ID} | ConvertTo-Json | Set-Content private-kit-output/PRIVATE_LOGO_COMPLETE_STATUS_v3.5.0.json -Encoding UTF8
          $files = @('private-kit-output/PRIVATE_LOGO_COMPLETE_STATUS_v3.5.0.json')
          foreach ($name in @('PRIVATE_LOGO_COMPLETE_LOG_v3.5.0.txt','LOCAL_BUILD_v3.5.0.log','PORTABLE_INSTALL_v3.5.0.log','MISSING_LOGO_TEST.log','AMBIGUOUS_LOGO_TEST.log','SETUP_TEST.log','PORTABLE_GUI_SMOKE.json')) {
            $file = Join-Path 'private-kit-output' $name
            if (Test-Path -LiteralPath $file) { $files += $file }
          }
          gh release upload v3.4.0-installer @files --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic publication failed.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-private-kit-verification
          path: |
            private-kit-output/*.json
            private-kit-output/*.txt
            private-kit-output/*.log
          retention-days: 7
